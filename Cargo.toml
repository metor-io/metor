[workspace]
resolver = "2"
members = [
    #"libs/metor-ui",
    "libs/nox",
    "libs/nox-frames",
    #"apps/metor",
    "libs/metor-component",
    "libs/metor-component/macros",
    "libs/metor-adcs",
    "libs/wmm",
    "libs/metor-proto",
    "libs/metor-proto/stellar",
    #"libs/metor-proto/bevy",
    "libs/metor-proto/wkt",
    "libs/metor-proto/bbq",
    "libs/metor-proto/frame",
    "libs/db",
    "libs/db/cli",
    "libs/db/tests",
    "libs/stellarator",
    "libs/stellarator/buf",
    "libs/stellarator/macros",
    "libs/stellarator/maitake",
    "libs/stellarator/maitake/util",
    "libs/video-toolbox",
    "libs/postcard-c/codegen",
    "apps/inscriber",
    "fsw/video-streamer",
    "fsw/gstreamer",
    "libs/db/eql",
    "libs/metor-proto/kdl",
    "libs/metor-panel",
    "libs/metor-fsw-2",
    "libs/metor-fsw-2/core",
    "libs/metor-fsw-2/macros",
    "libs/metor-fsw-2/ring",
    "libs/metor-fsw-2/tests/fixtures/dl-fixture",
    "libs/metor-fsw-2/tests/fixtures/seq-fixture",
    "libs/metor-fsw-2/tests/fixtures/seq-param-fixture",
    "examples/adcs-fsw2",
    "examples/adcs-fsw2/contracts",
    "examples/adcs-fsw2/systems/adcs-systems",
    "examples/adcs-fsw2/systems/adcs-sequences",
]
exclude = ["fsw/sensor-fw", "fsw/blackbox", "docs/memserve", "apps/metor"]

# Shared lint pins. Opt-in per crate via `[lints] workspace = true` — the fsw-2
# crates use it (review S5); other crates are unaffected until they opt in.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Set by the verification tools rather than by any Cargo feature, so they have
# to be declared here or every `#[cfg]` on them warns. `ring_loom` rather than
# the conventional `loom` because a bare `--cfg loom` in `RUSTFLAGS` reaches
# every crate in the graph, and third-party crates that gate on it (such as
# `concurrent-queue`, via `stellarator`) keep loom behind an optional feature
# this workspace does not enable. See `libs/metor-fsw-2/ring/{KANI,LOOM}.md`.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(kani)',
    'cfg(ring_loom)',
] }

[workspace.package]
version = "0.14.2"
edition = "2024"
repository = "https://github.com/metor-io/metor"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.macos-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
dirs = "5"
metor-component-macros.path = "libs/metor-component/macros"
metor-component.path = "libs/metor-component"
metor-adcs.path = "libs/metor-adcs"
nox.path = "libs/nox"
nox.default-features = false
nox-frames.path = "libs/nox-frames"
wmm.path = "libs/wmm"

[profile.release-with-debug]
inherits = "release"
debug = true

# Route the published facet crates through our fork so the gpui Entity/Hsla/SharedString
# impls and the inspect attribute grammar are present everywhere — including in
# transitive deps like facet-json/facet-format that pull facet from crates.io.
[patch.crates-io]
facet = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-core = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-reflect = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macros = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macros-impl = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macro-parse = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macro-types = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-path = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-solver = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
