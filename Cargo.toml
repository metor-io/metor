[workspace]
resolver = "2"
members = [
    #"libs/metor-ui",
    "libs/nox",
    "libs/nox-frames",
    #"apps/metor",
    "libs/metor-fsw",
    "libs/metor-fsw/macros",
    "libs/metor-fsw/adcs",
    "libs/wmm",
    "libs/metor-proto",
    "libs/metor-proto/stellar",
    #"libs/metor-proto/bevy",
    "libs/metor-proto/wkt",
    "libs/metor-proto/bbq",
    "libs/metor-proto/frame",
    "libs/db",
    "libs/db/cli",
    "libs/db/tests",
    "libs/stellarator",
    "libs/stellarator/buf",
    "libs/stellarator/macros",
    "libs/stellarator/maitake",
    "libs/stellarator/maitake/util",
    "libs/video-toolbox",
    "libs/postcard-c/codegen",
    "apps/inscriber",
    "fsw/video-streamer",
    "fsw/gstreamer",
    "libs/db/eql",
    "libs/metor-proto/kdl",
    "examples/cube-sat"
, "libs/metor-panel", "libs/metor-fsw-2/ring", "libs/metor-fsw-2", "examples/adcs-fsw2", "libs/metor-fsw-2/tests/fixtures/dl-fixture"]
exclude = ["fsw/sensor-fw", "fsw/blackbox", "docs/memserve", "apps/metor"]

[workspace.package]
version = "0.14.2"
edition = "2024"
repository = "https://github.com/metor-io/metor"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.macos-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
dirs = "5"
metor-fsw-macros.path = "libs/metor-fsw/macros"
metor-fsw.path = "libs/metor-fsw"
metor-fsw.default-features = false
metor-fsw-adcs.path = "libs/metor-fsw/adcs"
nox.path = "libs/nox"
nox.default-features = false
nox-frames.path = "libs/nox-frames"
wmm.path = "libs/wmm"

[profile.release-with-debug]
inherits = "release"
debug = true

# Route the published facet crates through our fork so the gpui Entity/Hsla/SharedString
# impls and the inspect attribute grammar are present everywhere — including in
# transitive deps like facet-json/facet-format that pull facet from crates.io.
[patch.crates-io]
facet = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-core = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-reflect = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macros = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macros-impl = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macro-parse = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-macro-types = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-path = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
facet-solver = { git = "https://github.com/metor-io/facet.git", branch = "sphw/facet-gpui" }
