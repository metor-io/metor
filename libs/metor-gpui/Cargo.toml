[package]
name = "metor-gpui"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "gpui primitives shared by metor-panel and the metor-ci web GUI"

[dependencies]
gpui.workspace = true
tracing = "0.1"
serde_json = "1"
web-time = "1"
serde = { version = "1", features = ["derive"] }
jiff = "0.2"
smallvec = "1"

[dev-dependencies]
gpui_platform.workspace = true

# test-support pulls in proptest, which does not build for wasm32.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = "0.2"

[lints]
workspace = true

[[example]]
name = "hello_web"
path = "examples/hello_web/main.rs"

[[example]]
name = "graph"
path = "examples/graph.rs"

[[example]]
name = "web_gallery"
path = "examples/web_gallery/main.rs"
