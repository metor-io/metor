[package]
name = "metor-expr-prelude"
license = "MIT OR Apache-2.0"
version = "0.14.2"
edition = "2024"
publish = false
description = "The guest-side kernel library metor-expr splices generated functions into"

# A guest crate that links for `wasm32-unknown-unknown` and for nothing
# else, which is why it sits outside the root workspace rather than inside
# its `members` list. It is `no_std`: a panic traps through `unreachable`.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["tensor-kernels"]
# Off only for the size measurement the M0 spike records: it isolates what the
# tensor layer costs the guest over bare libm.
tensor-kernels = ["dep:nox-array"]

[dependencies]
libm = "0.2"
nox-array = { path = "../../nox/array", optional = true }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
