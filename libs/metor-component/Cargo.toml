[package]
name = "metor-component"
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
description = "The component model shared by the metor flight-software crates: paths, vtables, and metadata."
repository = "https://github.com/metor-sys/metor"

[lints]
workspace = true

[dependencies]
metor-proto.path = "../metor-proto"
metor-proto.features = ["std"]
metor-proto-wkt.path = "../metor-proto/wkt"
# `ComponentValue` carriers in wkt are `nox`-gated, and this crate already
# requires `metor-proto/std`, so wkt's std-gated impls must come along.
metor-proto-wkt.features = ["nox", "std"]

metor-component-macros.workspace = true

nox.workspace = true
nox.default-features = false

zerocopy.version = "0.8.2"
zerocopy.features = ["derive"]
