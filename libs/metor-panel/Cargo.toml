[package]
name = "metor-panel"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
gpui = "*"
hifitime.version = "4.0"
nucleo-matcher = "0.3"
metor-db.path = "../db"
metor-proto.path = "../metor-proto"
metor-proto.features = ["std"]
serde = { version = "1", features = ["derive"] }
smallvec = "1"
serde_json = "1"
peg = "0.8.5"
zerocopy = "0.8"
jiff = "0.2"
stellarator.path = "../stellarator"

[[example]]
name = "component_text"
path = "examples/component_text.rs"

[[example]]
name = "time_series_plot"
path = "examples/time_series_plot.rs"

[[example]]
name = "component_table"
path = "examples/component_table.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
