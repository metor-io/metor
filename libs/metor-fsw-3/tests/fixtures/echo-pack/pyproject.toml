# The pack fields `metor pack dev` reads; the defaults cover the rest.

[project]
name = "echo-pack"
version = "0.1.0"
description = "The pack the metor-fsw-3 CLI and dl tests build"
requires-python = ">=3.11"

[tool.metor.pack]
id = "echo"

# The fixture is its own target: `metor run target.py` refreshes this pack.
[tool.uv.sources]
echo-pack = { path = "." }
