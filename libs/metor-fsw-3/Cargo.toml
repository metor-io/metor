[package]
name = "metor-fsw-3"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
metor-fsw-3-macros = { path = "macros" }
metor-fsw-3-ring = { path = "ring" }

metor-component = { workspace = true }
metor-proto = { path = "../metor-proto", features = ["std"] }
metor-proto-wkt = { path = "../metor-proto/wkt", features = ["std"] }

futures-lite = "2"
postcard = { version = "1.1", features = ["alloc", "experimental-derive"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
stellarator = { path = "../stellarator" }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
zerocopy = { version = "0.8.2", features = ["derive"] }

[dev-dependencies]
trybuild = "1"

[lints]
workspace = true
