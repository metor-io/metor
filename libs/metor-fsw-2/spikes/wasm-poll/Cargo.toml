# A detached workspace on purpose: the spike must not perturb the main
# workspace's members, lockfile, or CI.
[workspace]

[package]
name = "wasm-poll"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike host: drive a wasm sequence guest one poll per cycle under a fuel budget"

[dependencies]
wasm-poll-guest = { path = "guest" }
wasmi = "1.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
