[package]
name = "metor-fsw-ring"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "Shared-memory ring buffer for metor-fsw-2"
authors = ["sascha@metor.io"]

[lints]
workspace = true

[features]
default = ["async"]
# In-process async wake (data-available / space-available) via a stellarator
# WaitQueue notifier.
async = ["dep:stellarator"]
# mmap-backed shared-memory region (cross-process capable backing store).
mmap = ["dep:memmap2"]
# Cross-process wait/wake on a shared AtomicU32 (the `wake` module): a
# shared-memory futex on Linux, os_sync_wait_on_address on macOS 14.4+.
futex = ["dep:libc"]

[dependencies]
libc = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
stellarator = { path = "../../stellarator", optional = true }
zerocopy = { version = "0.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.13"
