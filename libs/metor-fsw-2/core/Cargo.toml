[package]
name = "metor-fsw-2-core"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "The authoring surface of the metor-fsw-2 flight-software framework: frames, ports, systems, and packs"
authors = ["sascha@metor.io"]

[lints]
workspace = true

[dependencies]
# metor-proto
metor-proto = { path = "../../metor-proto", features = ["std"] }
metor-proto-wkt = { path = "../../metor-proto/wkt", features = ["nox", "std"] }

# component model — the frame traits and derives this crate re-exports
metor-component = { workspace = true }
metor-fsw-2-macros = { path = "../macros" }

# channels. No `mmap` (a guest maps nothing) and no `notify` (the in-process
# wake endpoint is the coordinator's); the host turns both back on.
metor-fsw-ring = { path = "../ring", default-features = false }

# serialization
postcard = { version = "1.1", features = ["alloc"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
# The value-tree params path: `serde_ignored` supplies the typo guard, and
# `postcard-dyn` encodes against a schema the host never links.
postcard-dyn = { version = "0.2" }
serde_json = { version = "1.0" }
serde_ignored = { version = "0.1" }
zerocopy = { version = "0.8.2", features = ["derive"] }

# Pack-crate-local collection of per-field params docs (ABI v6): a
# `#[derive(ParamsDocs)]` submits entries the in-`.so` describe path collects.
inventory = "0.3"

# errors. `default-features = false`: params errors carry a `SourceSpan` and
# nothing renders here — the host owns the fancy reporter.
miette = { version = "7.0", default-features = false }
thiserror = { version = "2.0" }

# A loaded pack installs the forwarding layer so its `tracing` events reach
# the host as `LogEvent` messages.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
