[package]
name = "metor-fsw-2"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "Frames & component derives for the metor-fsw-2 flight-software framework"
authors = ["sascha@metor.io"]

[lints]
workspace = true

[dependencies]
# The authoring surface, re-exported whole from `lib.rs`.
metor-fsw-2-core = { path = "core" }

# metor-proto
metor-proto = { path = "../metor-proto", features = ["std"] }
metor-proto-wkt = { path = "../metor-proto/wkt", features = ["nox", "std"] }
metor-proto-stellar = { path = "../metor-proto/stellar" }

# component model — the frame traits and derives this crate re-exports
metor-component = { workspace = true }
metor-fsw-2-macros = { path = "macros" }

# channels, with `mmap` and `notify` on: the host maps process-system regions
# and owns the in-process wake endpoint.
metor-fsw-ring = { path = "ring" }
memmap2 = "0.9"

# service discovery
gethostname = "1.1"
mdns-sd = "0.13"

# async
futures-lite = "2.5.0"
stellarator = { path = "../stellarator" }

# serialization
postcard = { version = "1.1", features = ["alloc"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
postcard-dyn = { version = "0.2" }
serde_json = { version = "1.0" }
toml = { version = "0.8" }
sha2 = { version = "0.10" }
# The pack-wheel writer's RECORD digests and zip CRCs (both already in the
# workspace lock as transitive deps).
base64 = { version = "0.22" }
crc32fast = { version = "1.5" }
zerocopy = { version = "0.8.2", features = ["derive"] }

libloading = { version = "0.8" }

# The wasm occupant backing: a pure-Rust interpreter with fuel metering, so a
# guest poll is bounded rather than able to stall the cycle (docs/plans/wasm-occupant.md).
wasmi = { version = "1.1", default-features = false, features = ["std"] }

# errors
miette = { version = "7.0", features = ["fancy"] }
thiserror = { version = "2.0" }

# cli
clap = { version = "4", features = ["derive"] }
tempfile = { version = "3.13" }

# Runtime instrumentation: lifecycle events across the coordinator, slots,
# and links, plus the forwarding layer that downlinks them as `LogEvent`
# messages.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-indicatif = { version = "0.3" }
owo-colors = { version = "4.3", features = ["supports-colors"] }

[[bin]]
name = "metor-fsw"
path = "src/bin/metor-fsw.rs"

[dev-dependencies]
# Assembles the tiny out-of-bounds module the wasm sandbox test needs.
wat = "1"
tempfile = "3.13"
trybuild = "1"
serde_json = "1.0"

# Its own main calls `proc::worker_entry()` first, so the test binary can be
# re-executed as the worker for process systems (a libtest main cannot).
[[test]]
name = "proc_integration"
harness = false
