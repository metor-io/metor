[package]
name = "metor-fsw-2"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "Frames & component derives for the metor-fsw-2 flight-software framework"
authors = ["sascha@metor.io"]

[dependencies]
metor-proto = { path = "../metor-proto", features = ["std"] }
# `nox` forces `metor-proto-wkt`'s ComponentValue on via feature unification, so
# the (pre-existing, nox-gated) wkt build is satisfied for this crate.
metor-proto-wkt = { path = "../metor-proto/wkt", features = ["nox", "std"] }
metor-fsw = { path = "../metor-fsw", default-features = false, features = ["std"] }
metor-fsw-ring = { path = "ring", default-features = false, features = ["async"] }
metor-fsw-macros = { path = "../metor-fsw/macros" }
stellarator = { path = "../stellarator" }
zerocopy = { version = "0.8.2", features = ["derive"] }

# Wiring front-end (the `kdl` feature): KDL config language + span-carrying errors.
kdl = { version = "6.3.4", optional = true }
miette = { version = "7.0", features = ["fancy"], optional = true }
thiserror = { version = "2.0", optional = true }

[features]
default = ["kdl"]
# The KDL wiring loader (`wiring` module): registry, FromKdlNode derive, `load()`.
kdl = ["dep:kdl", "dep:miette", "dep:thiserror"]
