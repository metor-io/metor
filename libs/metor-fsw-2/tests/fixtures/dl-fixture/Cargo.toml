[package]
name = "metor-fsw-2-dl-fixture"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "A dl-open integration-test fixture: a two-entry cyclic pack exported as a cdylib"

# A real loadable shared object: the `dl_integration` test `dlopen`s the produced
# `lib*.dylib`/`lib*.so` and drives its `fsw_*` C-ABI surface.
[lib]
crate-type = ["cdylib"]

[dependencies]
metor-fsw-2 = { path = "../../.." }
zerocopy = { version = "0.8.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
