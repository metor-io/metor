[package]
name = "metor-fsw-2-seq-fixture"
license = "MIT OR Apache-2.0"
version.workspace = true
repository.workspace = true
edition = "2024"
publish = false
description = "A slots/sequences integration-test fixture: one #[sequence] occupant exported as a cdylib"

# A real loadable shared object: the `slot_integration` test `dlopen`s the produced
# `lib*.dylib`/`lib*.so` and drives it through a runtime slot.
[lib]
crate-type = ["cdylib"]

[dependencies]
metor-fsw-2 = { path = "../../.." }
zerocopy = { version = "0.8.2", features = ["derive"] }
