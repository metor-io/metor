# The target-config recorder as a distribution (docs/packaging.md).
#
# Targets depend on it like any package (a path source while in this repo).
# The `metor-fsw` binary still embeds a copy as the no-venv fallback; the
# evaluator prefers a venv-installed `metor_config` over the embedded one.

[project]
name = "metor-config"
version = "0.4.0"
description = "Typed target-config recorder for metor-fsw: build a Target, emit Wiring IR"
requires-python = ">=3.10"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "metor_config"
module-root = ""
