[package]
name = "metor-star"
license = "MIT OR Apache-2.0"
version.workspace = true
edition = "2024"
description = "Star-tracker algorithms: vector geometry and Wahba's problem."
repository.workspace = true

[features]
default = []
testkit = []
# The CPU star-field renderer.
sim = []

[dependencies]
libm = "0.2.16"
crc32fast = { version = "1.5", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
nalgebra = "0.35"
nox = { workspace = true }
rand = "0.9"
rand_distr = "0.5"

[lints]
workspace = true

[[test]]
name = "lis_sim"
required-features = ["sim", "testkit"]
