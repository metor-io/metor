# Builds the star-sim render catalog (`starcat.bin`) from Gaia DR3 and
# Hipparcos, and fetches built catalogs by sha256.
#
# The base install is stdlib only (`starcat.ensure`). `build` adds the query
# and astrometry stack.

[project]
name = "metor-starcat"
version = "0.1.0"
description = "Gaia DR3 + Hipparcos render catalog builder and fetcher for metor-star"
requires-python = ">=3.11"

[project.optional-dependencies]
build = [
    "astropy>=6.1",
    "astropy-healpix>=1.0",
    "astroquery>=0.4.10",
    "numpy>=1.26",
    "pyerfa>=2.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
starcat-build = "starcat.build:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "starcat"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: queries the Gaia archive (opt in with -m network)"]
