[package]
name = "stand-io-pack"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "The stand_io pack: a simulated pressure chamber and a monitor, for the metor-code-stand example"

# The host loads the cdylib; tests link the rlib. The `export` feature adds the
# C ABI, so tests turn it off.
[lib]
name = "stand_io"
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
export = []

[dependencies]
metor-fsw-3 = { path = "../../../../libs/metor-fsw-3", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8.2", features = ["derive"] }

[lints]
workspace = true
