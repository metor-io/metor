[package]
name = "adcs-contracts-3"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Shared frames, params, and physics for the adcs-fsw3 example"

[dependencies]
# `#[derive(Frame)]` expands to `metor_fsw_3::…`; the contracts never touch the host runtime.
metor-fsw-3 = { path = "../../../libs/metor-fsw-3", default-features = false }
# The standalone component derives on `ReactionWheel`, which is nested rather than a frame.
metor-component = { workspace = true }
nox = { workspace = true }
nox-frames = { path = "../../../libs/nox-frames", features = ["earth"] }
wmm = { path = "../../../libs/wmm" }
hifitime = "4.0"
zerocopy = { version = "0.8.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "1"

[lints]
workspace = true
