[package]
name = "adcs-contracts-3"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Shared frames, params, and physics for the adcs-fsw3 example"

[features]
default = ["environment"]
environment = ["dep:nox-frames", "dep:wmm", "dep:hifitime"]

[dependencies]
metor-fsw-3 = { path = "../../../libs/metor-fsw-3", default-features = false }
metor-component = { workspace = true }
nox = { workspace = true }
nox-frames = { path = "../../../libs/nox-frames", features = ["earth"], optional = true }
wmm = { path = "../../../libs/wmm", optional = true }
hifitime = { version = "4.0", optional = true }
zerocopy = { version = "0.8.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "1"

[lints]
workspace = true
