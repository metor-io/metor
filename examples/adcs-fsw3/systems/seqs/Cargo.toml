[package]
name = "adcs-seqs-3"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "The seqs pack: the commissioning sequence of the adcs-fsw3 example"

# The host loads the cdylib or the module, and tests link the rlib to register
# `pack()` directly. The `export` feature adds the pack's exports, so tests turn
# it off.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
export = []

[dependencies]
adcs-contracts = { package = "adcs-contracts-3", path = "../../contracts", default-features = false }
metor-fsw-3 = { path = "../../../../libs/metor-fsw-3", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
metor-fsw-3 = { path = "../../../../libs/metor-fsw-3" }
serde_json = "1"

[lints]
workspace = true
