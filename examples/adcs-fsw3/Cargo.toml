[package]
name = "adcs-fsw3"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Cube-sat attitude control example: two packs, a simulation, and a three-target deployment"

[lints]
workspace = true

[dev-dependencies]
adcs-contracts = { package = "adcs-contracts-3", path = "contracts" }
adcs-seqs = { package = "adcs-seqs-3", path = "systems/seqs", default-features = false }
adcs-systems = { package = "adcs-systems-3", path = "systems/adcs", default-features = false }
metor-fsw-3 = { path = "../../libs/metor-fsw-3" }
metor-proto = { path = "../../libs/metor-proto", features = ["std"] }
metor-proto-stellar = { path = "../../libs/metor-proto/stellar" }
metor-proto-wkt = { path = "../../libs/metor-proto/wkt", features = ["std"] }
metor-star = { path = "../../libs/metor-star", features = ["sim", "std"] }
nox = { workspace = true }
serde_json = "1"
startracker-sim = { package = "startracker-sim-3", path = "systems/startracker-sim", default-features = false }
stellarator = { path = "../../libs/stellarator" }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
zerocopy = { version = "0.8.2", features = ["derive"] }
