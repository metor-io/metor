[package]
name = "adcs-contracts"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Shared compile-time contracts (frames + per-system Params) for the adcs-fsw2 dlopen mission"

[dependencies]
# The frame derives (`Frame`/`AsVTable`/…) are self-contained — they expand to
# `::metor_fsw_2::…` paths, so this crate needs only metor-fsw-2 (no direct metor-fsw).
metor-fsw-2 = { path = "../../../libs/metor-fsw-2" }
nox = { workspace = true }
zerocopy = { version = "0.8.2", features = ["derive"] }
# `Params` cross the dlopen boundary as canonical postcard bytes, schema-guided from the
# `.so`'s exported `Schema` (dl-open.md §6.3) — hence the Serialize/Deserialize/Schema triple.
serde = { version = "1.0", features = ["derive"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
