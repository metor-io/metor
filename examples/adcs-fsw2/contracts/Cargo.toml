[package]
name = "adcs-contracts"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Shared compile-time contracts (frames + per-system Params) for the adcs-fsw2 dlopen target"

[dependencies]
# The authoring surface only: `#[derive(Frame)]` is self-contained and expands to
# `metor_fsw_2_core::…` paths. Contracts never touch the host runtime.
metor-fsw-2-core = { path = "../../../libs/metor-fsw-2/core" }
# The standalone component derives (AsVTable/Componentize/… on the nested `ReactionWheel`,
# which is not a top-level `Frame`) live in metor-component and expand to
# `::metor_component::…` paths, so it has to be in scope too — metor-fsw-2 re-bundles
# them only inside `#[derive(Frame)]`.
metor-component = { workspace = true }
nox = { workspace = true }
# Real-world environment models: the ECI sun direction (Vallado) at an epoch, plus the
# ECI↔ECEF↔NED frame chain the WMM magnetic field is evaluated through.
nox-frames = { path = "../../../libs/nox-frames", features = ["earth"] }
# The NOAA World Magnetic Model (a bindgen wrapper over the WMM C library) — the true +
# reference Earth magnetic field, replacing the crude tilted-dipole model.
wmm = { path = "../../../libs/wmm" }
hifitime = "4.0"
zerocopy = { version = "0.8.2", features = ["derive"] }
# `Params` cross the dlopen boundary as canonical postcard bytes, schema-guided from the
# `.so`'s exported `Schema` (dl-open.md §6.3) — hence the Serialize/Deserialize/Schema triple.
serde = { version = "1.0", features = ["derive"] }
postcard-schema = { version = "0.2", features = ["derive", "use-std"] }
