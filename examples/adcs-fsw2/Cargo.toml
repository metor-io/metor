[package]
name = "adcs-fsw2"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The target host links ONLY the framework: `main` delegates to `metor_fsw_2::cli::main()`
# (the runner evaluates `target.py`), and the convergence test's `build_sim_coordinator` builds
# + dlopens the system cdylibs. It links neither the system crates nor the shared
# `adcs-contracts` — frames are validated from serialized VTables and params encoded from the
# exported schema, so the host stays schema-agnostic (dl-open.md §6.3, §8; cli-runner.md §6).
# No `stellarator` here: the `main` shim is sync; the CLI enters the runtime internally.
metor-fsw-2.path = "../../libs/metor-fsw-2"
anyhow = "1"

[dev-dependencies]
# `tests/sequences.rs` reads the slot's `ModeCmd` output, so it links the shared frame
# contracts; the tests run the coordinator, so they enter the runtime themselves. The
# runtime/dlopen path stays decoupled (dl-open.md §8).
adcs-contracts = { path = "contracts" }
stellarator.path = "../../libs/stellarator"
