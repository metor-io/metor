[package]
name = "adcs-fsw2"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The mission host links ONLY the framework: it describes the mission as a `Wiring`, builds
# the system cdylibs, and dlopens them. It links neither the system crates nor the shared
# `adcs-contracts` — frames are validated from serialized VTables and params encoded from the
# exported schema, so the host stays schema-agnostic (dl-open.md §6.3, §8).
metor-fsw-2.path = "../../libs/metor-fsw-2"
stellarator.path = "../../libs/stellarator"
anyhow = "1"

[dev-dependencies]
# The convergence test links the system crates as **rlibs** (default-features = false, so
# their `fsw_*` C-ABI symbols are excluded and three system rlibs link cleanly into one test
# binary) for the static-vs-dlopen parity comparison, and `adcs-contracts` to decode the
# tapped `truth` output. The runtime/dlopen path stays decoupled (dl-open.md §8).
adcs-contracts = { path = "contracts" }
adcs-plant = { path = "systems/plant", default-features = false }
adcs-nav = { path = "systems/nav", default-features = false }
adcs-ctrl = { path = "systems/ctrl", default-features = false }
stellarator.path = "../../libs/stellarator"
