[package]
name = "adcs-fsw2"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The mission host links ONLY the framework: `main` delegates to `metor_fsw_2::cli::main()`
# (the runner reads `mission.kdl`), and the convergence test's `build_sim_coordinator` builds
# + dlopens the system cdylibs. It links neither the system crates nor the shared
# `adcs-contracts` — frames are validated from serialized VTables and params encoded from the
# exported schema, so the host stays schema-agnostic (dl-open.md §6.3, §8; cli-runner.md §6).
# No `stellarator` here: the `main` shim is sync; the CLI enters the runtime internally.
metor-fsw-2.path = "../../libs/metor-fsw-2"
anyhow = "1"

[dev-dependencies]
# The convergence test links the systems pack as an **rlib** (default-features = false, so
# its `fsw_pack_*` C-ABI symbols are excluded) and registers the same `pack()` the cdylib
# exports for the static-vs-dlopen parity comparison, plus `adcs-contracts` to decode the
# tapped `truth` output. The runtime/dlopen path stays decoupled (dl-open.md §8).
adcs-contracts = { path = "contracts" }
adcs-systems = { path = "systems/adcs-systems", default-features = false }
stellarator.path = "../../libs/stellarator"
# The downlink message-emission regression test (`tests/sequences.rs`) decodes the slot's
# `SequenceChannelEvent`/`SequenceRegistry` records off the message ring — the same
# `(PacketId, postcard)` tap the telemetry downlink performs (docs/messages.md §3).
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
