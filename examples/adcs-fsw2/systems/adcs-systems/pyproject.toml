# The adcs pack as a Python distribution (docs/design-packaging.md §6.1).
#
# A mission consumes it as an ordinary dependency; while it lives in this
# repo, a `[tool.uv.sources]` path entry points here and `uv sync` runs the
# backend, which lays out `.metor/adcs_pack/` (typed module + host-triple
# lib) via `metor-fsw pack dev` and exposes it to the venv.

[project]
name = "adcs-pack"
version = "0.1.0"
description = "The plant, nav, and ctrl systems of the adcs-fsw2 mission"
requires-python = ">=3.11"

[build-system]
requires = []
build-backend = "metor_build_shim"
backend-path = ["_backend"]

[tool.metor.pack]
id = "adcs"

# Rebuild (and so regenerate the module + lib) when the pack sources change,
# including the sibling contracts crate. Out-of-dir (`../`) globs need
# uv ≥ 0.11 — on 0.5.x only the in-dir globs invalidate, and a
# contracts-only change must be healed with
# `uv sync --reinstall-package adcs-pack`.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../contracts/src/**/*.rs" },
    { file = "../../contracts/Cargo.toml" },
]
