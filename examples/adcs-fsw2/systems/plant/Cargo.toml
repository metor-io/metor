[package]
name = "adcs-plant"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "The rigid-body plant/dynamics system of the adcs-fsw2 mission, as a dlopen'd cdylib"

# A loadable shared object (the mission host `dlopen`s the produced `lib*.so`/`lib*.dylib`)
# AND an rlib, so the convergence test can also link `PlantSystem` for the static-vs-dlopen
# parity comparison (dl-open.md §8). The `export` feature gates the `export_system!` C-ABI
# symbols so the rlib carries none (the test links it with `default-features = false`),
# avoiding a duplicate `fsw_*` symbol clash when all three system rlibs link into one test
# binary; the build driver builds the cdylib with default features (export on).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
# Emit the `fsw_*` C-ABI surface (the dlopen entry points). On for the cdylib; off for the
# rlib the test links statically.
export = []

[dependencies]
adcs-contracts = { path = "../../contracts" }
metor-fsw-2 = { path = "../../../../libs/metor-fsw-2" }
nox = { workspace = true }
rand = "0.9"
rand_distr = "0.5"
