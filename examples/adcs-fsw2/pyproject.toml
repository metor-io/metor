# The adcs-fsw2 mission as a consumer (docs/design-packaging.md §6.2): a
# virtual uv project — no build system of its own — whose packs and the
# recorder are ordinary dependencies. Both packs are path sources while they
# live in this repo; `uv sync` runs each pack's backend (`metor-fsw pack
# dev`), and deleting a source line switches that pack to an index build
# with the same import name.

[project]
name = "adcs-fsw2"
version = "0.1.0"
description = "adcs-fsw2 mission config"
requires-python = ">=3.11"
dependencies = ["adcs-pack", "adcs-seqs", "metor-config"]

[tool.uv.sources]
adcs-pack = { path = "systems/adcs-systems", editable = true }
adcs-seqs = { path = "systems/adcs-sequences", editable = true }
metor-config = { path = "../../libs/metor-fsw-2/python/metor-config", editable = true }
