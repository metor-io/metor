[package]
name = "sysstats-systems-3"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "The stats pack: cpu, mem, nics, procs, and disks systems for the sysstats-fsw3 example"

# The host loads the cdylib, and tests link the rlib to register `pack()` directly.
# The `export` feature adds the C ABI, so tests turn it off.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
export = []

[dependencies]
futures-lite = "2"
libc = "0.2"
metor-component = { workspace = true }
metor-fsw-3 = { path = "../../../../libs/metor-fsw-3", default-features = false, features = ["threads"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
stellarator = { path = "../../../../libs/stellarator" }
thiserror = "2.0"
tracing = "0.1"
zerocopy = { version = "0.8.2", features = ["derive"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
